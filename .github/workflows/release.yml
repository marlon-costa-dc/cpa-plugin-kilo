name: Publish plugin
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: linux_amd64
          - runner: ubuntu-24.04-arm
            arch: linux_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build -buildmode=c-shared -o kilo.so ./go
      - run: zip "kilo_${GITHUB_REF_NAME#v}_${{ matrix.arch }}.zip" kilo.so
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kilo-${{ matrix.arch }}
          path: '*.zip'
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: kilo-*
          merge-multiple: true
      - run: sha256sum ./*.zip > checksums.txt
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes ./*.zip checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
